<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
<title id="title">Prior selection and reporting workflow</title><desc id="desc">Conceptual four-step workflow for selecting prior information, translating parameterizations, checking sensitivity, and reporting choices.</desc>
<rect width="640" height="240" rx="12" fill="#f5f8fa"/>
<text x="24" y="36" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#193a56">From prior choice to reporting</text>
<text x="24" y="58" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#60717e">Practical workflow for Bayesian variance priors</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<rect x="19" y="88" width="148" height="111" rx="10" fill="#ffffff" stroke="#c7d8df" stroke-width="1.5"/><text x="93" y="134" fill="#23445c" font-size="20" font-weight="700">Select</text><text x="93" y="158" fill="#60737f" font-size="12">Choose evidence</text>
<rect x="177" y="88" width="148" height="111" rx="10" fill="#ffffff" stroke="#c7d8df" stroke-width="1.5"/><text x="251" y="134" fill="#23445c" font-size="20" font-weight="700">Translate</text><text x="251" y="158" fill="#60737f" font-size="12">Map parameterization</text>
<rect x="335" y="88" width="148" height="111" rx="10" fill="#ffffff" stroke="#c7d8df" stroke-width="1.5"/><text x="409" y="134" fill="#23445c" font-size="20" font-weight="700">Check</text><text x="409" y="158" fill="#60737f" font-size="12">Test sensitivity</text>
<rect x="493" y="88" width="148" height="111" rx="10" fill="#e8f2f1" stroke="#aecdc9" stroke-width="1.5"/><text x="567" y="134" fill="#23445c" font-size="20" font-weight="700">Report</text><text x="567" y="158" fill="#60737f" font-size="12">Document decisions</text>
</g><g stroke="#6f9aae" stroke-width="2" fill="none"><path d="M154 144h11m-5-5 5 5-5 5"/>
