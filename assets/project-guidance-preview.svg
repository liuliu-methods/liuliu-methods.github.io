<text x="24" y="36" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#193a56">From prior choice to reporting</text>
<text x="24" y="58" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#60717e">Practical workflow for Bayesian variance priors</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<rect x="23" y="90" width="124" height="107" rx="10" fill="#ffffff" stroke="#c7d8df" stroke-width="1.5"/><text x="85" y="135" fill="#23445c" font-size="19" font-weight="700">Select</text><text x="85" y="159" fill="#60737f" font-size="12">Evidence</text>
<rect x="180" y="90" width="124" height="107" rx="10" fill="#ffffff" stroke="#c7d8df" stroke-width="1.5"/><text x="242" y="135" fill="#23445c" font-size="19" font-weight="700">Translate</text><text x="242" y="159" fill="#60737f" font-size="12">Across software</text>
<rect x="337" y="90" width="124" height="107" rx="10" fill="#ffffff" stroke="#c7d8df" stroke-width="1.5"/><text x="399" y="135" fill="#23445c" font-size="19" font-weight="700">Check</text><text x="399" y="159" fill="#60737f" font-size="12">Sensitivity</text>
