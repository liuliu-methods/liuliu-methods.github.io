<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="title desc"><title id="title">Precision gains from additional repeated occasions</title><desc id="desc">Increasing occasions from 7 to 21 reduced within-person confidence interval width by approximately 42 percent and between-person width by approximately 6 percent in the published simulation.</desc><rect width="720" height="270" rx="16" fill="#f5f8fa"/><text x="34" y="40" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d">More occasions, different precision gains</text><text x="34" y="65" font-family="Arial,sans-serif" font-size="13" fill="#596a76">7 to 21 repeated occasions · reduction in 95% CI width</text><text x="34" y="110" font-family="Arial,sans-serif" font-size="15" fill="#25394b">Within-person effects</text><rect x="34" y="124" width="580" height="25" rx="5" fill="#e1e8ed"/><rect x="34" y="124" width="244" height="25" rx="5" fill="#357e83"/><text x="294" y="143" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324d">42%</text><text x="34" y="188" font-family="Arial,sans-serif" font-size="15" fill="#25394b">Between-person effects</text><rect x="34" y="202" width="580" height="25" rx="5" fill="#e1e8ed"/><rect x="34" y="202" width="35" height="25" rx="5" fill="#b77f4b"/><text x="85" y="222" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324d">6%</text><text x="34" y="255" font-family="Arial,sans-serif" font-size="11" fill="#596a76">Source: Liu (2026), Methods in Psychology · Approximate results reported in the article</text></svg>