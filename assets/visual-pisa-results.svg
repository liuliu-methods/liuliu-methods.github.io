<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 275" role="img" aria-labelledby="title desc"><title id="title">PISA 2018 explainable machine learning study</title><desc id="desc">Study analyzed 74,235 students from ten selected education systems. CatBoost achieved average weighted R squared of 0.358 and mean absolute error of 57.29 mathematics score points.</desc><rect width="720" height="275" rx="16" fill="#f5f8fa"/><text x="32" y="43" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d">Explainable AI in PISA 2018 mathematics</text><text x="32" y="70" font-family="Arial,sans-serif" font-size="13" fill="#596a76">Survey-weighted, plausible-value-aware evaluation · selected education systems</text><g font-family="Arial,sans-serif"><rect x="30" y="95" width="205" height="128" rx="12" fill="#fff" stroke="#dce5ea"/><text x="49" y="140" font-size="34" font-weight="700" fill="#245b79">74,235</text><text x="49" y="169" font-size="14" fill="#4c5d68">students</text><text x="49" y="194" font-size="12" fill="#687783">10 education systems</text><rect x="257" y="95" width="205" height="128" rx="12" fill="#fff" stroke="#dce5ea"/><text x="276" y="140" font-size="34" font-weight="700" fill="#357e83">0.358</text><text x="276" y="169" font-size="14" fill="#4c5d68">weighted R²</text><text x="276" y="194" font-size="12" fill="#687783">CatBoost · average</text><rect x="484" y="95" width="205" height="128" rx="12" fill="#fff" stroke="#dce5ea"/><text x="503" y="140" font-size="34" font-weight="700" fill="#a36e42">57.29</text><text x="503" y="169" font-size="14" fill="#4c5d68">MAE · score points</text><text x="503" y="194" font-size="12" fill="#687783">CatBoost · average</text><text x="32" y="254" font-size="11" fill="#596a76">Source: Liu &amp; Dai (2026), Large-scale Assessments in Education · Predictive, not causal, results</text></g></svg>